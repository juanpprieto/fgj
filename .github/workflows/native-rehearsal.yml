name: native-rehearsal

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved full source commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-rehearsal-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native:
    if: github.event.repository.private && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PLATFORM: ${{ matrix.platform }}
      FGJ_FORGEJO_PORT: "49381"
    steps:
      - name: Checkout approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source identity
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
      - name: Set up Node for build tools only
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Install pinned compiler
        run: |
          npm install --global bun@1.3.14
          test "$(bun --version)" = 1.3.14
          bun -e 'if (process.arch !== "arm64") process.exit(1)'
      - name: Build candidate once
        run: |
          bun run package:native > "$RUNNER_TEMP/native-candidate.json"
          bun -e '
            const p = await Bun.file(process.env.RUNNER_TEMP + "/native-candidate.json").json();
            if (p.source_sha !== process.env.EXPECTED_SHA || p.platform !== process.env.PLATFORM) process.exit(1);
            await Bun.write("dist/native/candidate.json", JSON.stringify({ ...p, workflow_sha: process.env.GITHUB_WORKFLOW_SHA, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT }));
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_ENV, "CANDIDATE_SHA256=" + p.sha256 + "\nCANDIDATE_NAME=fgj-" + p.package_version + "-" + p.platform + ".tar.gz\n");
          '
      - name: Retain private candidate
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/native
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
      - name: Download the exact uploaded artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.archive.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-native
          digest-mismatch: error
      - name: Verify downloaded bytes and native startup
        run: |
          cd "$RUNNER_TEMP/downloaded-native"
          bun -e '
            const p = await Bun.file("candidate.json").json();
            const { createHash } = await import("node:crypto");
            const digest = createHash("sha256").update(new Uint8Array(await Bun.file(process.env.CANDIDATE_NAME).arrayBuffer())).digest("hex");
            if (digest !== process.env.CANDIDATE_SHA256 || digest !== p.sha256 || p.source_sha !== process.env.EXPECTED_SHA || p.workflow_sha !== process.env.GITHUB_WORKFLOW_SHA || p.run_id !== process.env.GITHUB_RUN_ID || p.run_attempt !== process.env.GITHUB_RUN_ATTEMPT) process.exit(1);
          '
          mkdir extracted empty-path
          tar -xzf "$CANDIDATE_NAME" -C extracted
          env -i HOME="$PWD/extracted" TMPDIR="$RUNNER_TEMP" PATH="$PWD/empty-path" "$PWD/extracted/fgj" version
          env -i HOME="$PWD/extracted" TMPDIR="$RUNNER_TEMP" PATH="$PWD/empty-path" "$PWD/extracted/fgj" help
          if test "$RUNNER_OS" = macOS; then /usr/bin/codesign --verify --strict extracted/fgj; fi
          printf 'FGJ_NATIVE_TARBALL=%s/downloaded-native/%s\n' "$RUNNER_TEMP" "$CANDIDATE_NAME" >> "$GITHUB_ENV"
      - name: Test native setup and first read on Linux
        if: runner.os == 'Linux'
        run: |
          bun scripts/forgejo-test-server.ts start
          bun test test/server/getting-started.test.ts
      - name: Stop owned Linux fixture
        if: always() && runner.os == 'Linux'
        run: bun scripts/forgejo-test-server.ts stop
